<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Админ</title><style>body{font-family:-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:15px;margin:0}h1{color:#58a6ff;font-size:1.2rem}label{display:block;margin-top:12px;font-size:.85rem;color:#8b949e}input{width:100%;padding:10px;margin-top:4px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;box-sizing:border-box}button{margin-top:15px;width:100%;padding:12px;background:#238636;color:#fff;border:none;border-radius:6px;font-weight:bold}#log{margin-top:15px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:monospace;font-size:.75rem;white-space:pre-wrap;max-height:250px;overflow-y:auto}.success{color:#3fb950}.error{color:#f85149}.info{color:#58a6ff}</style></head><body><h1>📤 Загрузить приложение</h1><label>GitHub токен</label><input type="password" id="token"><label>Владелец (ник)</label><input type="text" id="owner"><label>Репозиторий</label><input type="text" id="repo" value="moi-magazin"><label>APK файл</label><input type="file" id="apk" accept=".apk"><label>Название</label><input type="text" id="name"><label>Описание</label><input type="text" id="desc"><button onclick="up()">Загрузить</button><div id="log">Ожидание...</div><script>var API="https://api.github.com";function log(m,c){var l=document.getElementById("log");l.innerHTML+="<div class=\""+(c||"info")+"\">"+m+"</div>";l.scrollTop=l.scrollHeight}async function api(ep,opt){var t=document.getElementById("token").value.trim();var h={"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(!opt.raw)h["Content-Type"]="application/json";var r=await fetch(API+ep,Object.assign({},opt,{headers:h}));if(!r.ok){var e=await r.json().catch(function(){return {}});throw new Error(r.status+": "+(e.message||""))}return r.json()}function b64(s){return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(m,p){return String.fromCharCode("0x"+p)}))}async function up(){var owner=document.getElementById("owner").value.trim();var repo=document.getElementById("repo").value.trim();var f=document.getElementById("apk").files[0];var name=document.getElementById("name").value.trim();var desc=document.getElementById("desc").value.trim();var token=document.getElementById("token").value.trim();if(!f||!name||!owner||!repo){alert("Заполни всё");return}log("Чтение "+f.name+"...","info");try{var buf=await f.arrayBuffer();log("Создание релиза...","info");var rid;try{var rel=await api("/repos/"+owner+"/"+repo+"/releases",{method:"POST",body:JSON.stringify({tag_name:"apps",name:"Apps"})});rid=rel.id;}catch(e){var rels=await api("/repos/"+owner+"/"+repo+"/releases");rid=rels.find(function(r){return r.tag_name==="apps"}).id;}log("Загрузка APK...","info");var ur="https://uploads.github.com/repos/"+owner+"/"+repo+"/releases/"+rid+"/assets?name="+encodeURIComponent(f.name);var r=await fetch(ur,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/vnd.android.package-archive"},body:buf});if(!r.ok)throw new Error("upload "+r.status);var a=await r.json();log("Обновление apps.json...","info");var cf=await api("/repos/"+owner+"/"+repo+"/contents/apps.json");var apps=[];try{apps=JSON.parse(decodeURIComponent(escape(atob(cf.content.replace(/\n/g,"")))))}catch(e){apps=[]}apps.push({name:name,description:desc,url:a.browser_download_url,size:(f.size/1048576).toFixed(1)+" MB"});await api("/repos/"+owner+"/"+repo+"/contents/apps.json",{method:"PUT",body:JSON.stringify({message:"Add "+name,content:b64(JSON.stringify(apps,null,2)),sha:cf.sha})});log("Готово!","success");}catch(e){log("Ошибка: "+e.message,"error")}}</script></body></html>
