<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Магазин</title><style>body{font-family:-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:15px;margin:0}h1{color:#58a6ff;font-size:1.4rem}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:15px;margin-bottom:15px;display:flex;align-items:center}.icon{width:50px;height:50px;background:#30363d;border-radius:10px;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.info{flex:1;min-width:0}.info h3{margin:0 0 5px;font-size:1rem;word-break:break-word}.info p{margin:0;font-size:.8rem;color:#8b949e}.dl{margin-left:10px;background:#238636;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:.8rem}#load{text-align:center;color:#8b949e;margin-top:50px}</style></head><body><h1>📦 Магазин</h1><div id="c"><div id="load">Загрузка...</div></div><script>async function load(){try{var r=await fetch("apps.json?t="+Date.now());var a=await r.json();var c=document.getElementById("c");if(!a||a.length===0){c.innerHTML="<div style=\"text-align:center;color:#8b949e;margin-top:50px\">Пусто</div>";return}c.innerHTML=a.reverse().map(function(x){return "<div class=\"card\"><div class=\"icon\">📱</div><div class=\"info\"><h3>"+x.name+"</h3><p>"+(x.description||"")+"</p></div><a class=\"dl\" href=\""+x.url+"\" download>Скачать</a></div>"}).join("");}catch(e){document.getElementById("load").innerText="Ошибка"}}load();setInterval(load,15000);</script></body></html>
